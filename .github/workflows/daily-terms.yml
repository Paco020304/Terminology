name: Daily terminology terms

on:
  schedule:
    # 07:00 Asia/Shanghai (UTC+8) = 23:00 UTC on the previous day.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add daily terms
        env:
          TERMS_PER_DAY: "5"
        run: python scripts/add_daily_terms.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terms-data.js data/term-queue.json
          if git diff --cached --quiet; then
            echo "No term changes to commit"
          else
            git commit -m "Add daily terminology terms"
            git push
          fi
